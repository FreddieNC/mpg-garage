<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1015">
  <meta name="description" content="Track fuel economy for every vehicle in your garage.">
  <title>MPG Garage</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Phone header (only shown on narrow screens) -->
  <header class="mobile-head">
    <svg viewBox="0 0 40 40" class="brand-mark" aria-hidden="true">
      <defs><linearGradient id="bm2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient></defs>
      <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#bm2)"/>
      <path d="M11 26 A10 10 0 1 1 29 26" fill="none" stroke="#1a1208" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 23 L26 14" stroke="#1a1208" stroke-width="3" stroke-linecap="round"/>
      <circle cx="20" cy="23" r="2.6" fill="#1a1208"/>
    </svg>
    <div class="brand-name">MPG Garage</div>
    <button class="unit-pill" id="unitPill" aria-label="Change economy unit"></button>
  </header>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 40 40" class="brand-mark" aria-hidden="true">
          <defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient></defs>
          <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#bm)"/>
          <path d="M11 26 A10 10 0 1 1 29 26" fill="none" stroke="#1a1208" stroke-width="3" stroke-linecap="round"/>
          <path d="M20 23 L26 14" stroke="#1a1208" stroke-width="3" stroke-linecap="round"/>
          <circle cx="20" cy="23" r="2.6" fill="#1a1208"/>
        </svg>
        <div>
          <div class="brand-name">MPG Garage</div>
          <div class="brand-sub">Fuel economy tracker</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item" data-view="garage" id="navGarage">
          <svg viewBox="0 0 24 24"><path d="M3 10 12 4l9 6v10H3z M7 20v-6h10v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          Garage
        </button>
        <button class="nav-item" data-view="calc" id="navCalc">
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Quick calculator
        </button>
        <button class="nav-item" data-view="settings" id="navSettings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Settings &amp; backup
        </button>
      </nav>

      <div class="side-label">My vehicles</div>
      <div class="vehicle-list" id="vehicleList"></div>
      <button class="add-vehicle" id="addVehicleBtn" data-action="add-vehicle">
        <span>＋</span> Add vehicle
      </button>

      <div class="side-foot">
        <div class="side-label">Show economy as</div>
        <div class="unit-switch" id="unitSwitch">
          <button data-unit="uk-mpg">UK mpg</button>
          <button data-unit="us-mpg">US mpg</button>
          <button data-unit="kmpl">km/L</button>
          <button data-unit="l100">L/100km</button>
        </div>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <!-- Phone tab bar (only shown on narrow screens) -->
  <nav class="tabbar" aria-label="Sections">
    <button data-view="garage" class="tab" id="tabGarage">
      <svg viewBox="0 0 24 24"><path d="M3 10 12 4l9 6v10H3z M7 20v-6h10v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Garage</span>
    </button>
    <button data-action="quick-log" class="tab tab-main" id="tabLog" aria-label="Log a fill-up">
      <svg viewBox="0 0 24 24"><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h14M7 8h6M15 10h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Log</span>
    </button>
    <button data-view="calc" class="tab" id="tabCalc">
      <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Calculator</span>
    </button>
    <button data-view="settings" class="tab" id="tabSettings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Settings</span>
    </button>
  </nav>
  <input type="file" id="importInput" accept="application/json,.json" hidden>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Add vehicle</h2>
        <button class="icon-btn" data-close aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="cars.js"></script>
  <script src="app.js"></script>
</body>
</html>
